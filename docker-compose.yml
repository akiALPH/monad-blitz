version: "3.9"

services:
  engine:
    build: .
    container_name: monad-blitz-engine
    ports:
      - "3001:3001"
    environment:
      - MONAD_RPC=${MONAD_RPC:-https://testnet-rpc.monad.xyz}
      - MONAD_CHAIN_ID=${MONAD_CHAIN_ID:-10143}
      - MONAD_PRIVATE_KEY=${MONAD_PRIVATE_KEY:?err}
      - DEMO_PRIVATE_KEY=${DEMO_PRIVATE_KEY}
      - PORT=3001
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
